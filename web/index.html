<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<!-- The policy travels with the page.
     `serve/serve.go` sends this as a header, and the desktop build sends its
     own, but `web/` is a folder of files with no build step: it can be put on
     a bucket, on Pages, behind somebody's nginx, or opened off a disk, and
     none of those send anything. The reader's GitHub token and their storage
     keys are in this origin's IndexedDB, so a page that arrives without a
     policy is a page where any script that got in could read both.

     Two differences from the header, both deliberate:

     frame-ancestors is ignored in a meta tag, so it is not here. The header
     from serve/serve.go is still the only thing standing between this
     interface and a cross-origin frame; this tag does not replace it.

     asset:, ipc: and the two localhost origins are the desktop build's. A
     second policy is not a replacement for the first, it is intersected with
     it, so anything the desktop needs and this omits would be refused there.
     In a browser they are three origins nothing can reach and no widening
     worth the desktop build breaking. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; connect-src 'self' https: ipc: http://ipc.localhost; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: asset: http://asset.localhost; media-src 'self' blob: asset: http://asset.localhost">
<title>reviewer</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<!-- Installed, the window's own chrome is painted this, so it has to be the
     panel the interface actually sits on rather than a colour picked to look
     right in isolation. Dark is the design's native form; light follows the
     system, and so does this. -->
<meta name="theme-color" content="#0e0f12" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#faf8f4" media="(prefers-color-scheme: light)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
  /* The palette is defined once per role, so light and dark differ only in
     their values. Dark is the design's native form; light follows the system
     preference. There is no in-app toggle: the operating system already has
     one, and a second would only disagree with it. */

  :root {
    color-scheme: dark;

    --bg:#0e0f12; --panel:#101216; --panel2:#131519; --panel3:#16191f;
    --border:#24282f; --border2:#1f2329;
    --text:#e6e8ec; --bright:#eceff3; --dim:#a7aeb9; --dim2:#8b929d;
    --faint:#5b626d; --faint2:#3b424d;
    --accent:#6ea8fe; --accentFg:#0e0f12;
    --green:#57c98a; --red:#ff6b6b; --amber:#e8b04b;
    --critBg:rgba(255,107,107,.14); --warnBg:rgba(232,176,75,.14); --okBg:rgba(87,201,138,.10);

    /* Diff and code surfaces. */
    --code:#0f1115; --hunk:#0f1319; --hl:#232a3a;
    --addBg:rgba(87,201,138,.09); --delBg:rgba(255,107,107,.10);
    --addText:#8ad9ab; --delText:#ff9c9c;
    --greenBd:#2c4a3a; --redBd:#4a2c2f;

    /* Diagonal hatch used by the QA evidence video placeholders. */
    --hatchA:#16181d; --hatchB:#1b1e24;

    --shadow:rgba(0,0,0,.42);
    --mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans:'IBM Plex Sans', system-ui, sans-serif;

    /* Sizing is one decision, not two: nothing below differs between light and
       dark, so none of it is repeated in the light block. */

    /* Three heights, because a control is doing one of three jobs. Icon is a
       square around a 13px glyph and carries no label, so it is not a step on
       the same scale as the other two. Compact is the dense chrome - the
       settings panel, a setup line, the header - which carried 24, 26, 30 and
       32, and 30 is the one most of those rules already set. Standard is the
       height this sheet claimed for every button while setting eight, and what
       .chip is; #post at 38 and the verdict rail at 34 sat either side of it
       by 2px, which read as misalignment rather than as importance. */
    --ctlIcon:20px; --ctlCompact:30px; --ctlStandard:36px;

    /* Five steps covering what were eighteen sizes. Every font-size in this
       sheet reads one of these off, which is the standard: a size changes
       here or not at all, never on the selector that happened to need it
       first. 10.5, 11 and 12 fold into 11.5, 12.5 and 13.5 into 13, 14 and
       16 into 15. The 8px, 9px and 9.5px marks left outside the scale are
       glyphs inside dots and badges rather than read text, and the one
       literal 16px on a mobile input is a technical floor (iOS's zoom-on-
       focus threshold), not a type choice - see its own comment. */
    --textMicro:10px; --textSmall:11.5px; --textBody:13px;
    --textLead:15px; --textDisplay:19px;

    /* Button-likes carry five radii today. 6 is by far the most used; 5 and 7
       are lone rules a pixel away from it; 4 is the icon button, where 6 on a
       20px square starts to read as a pill. Panels sit at 8 to 12 and collapse
       to 10. */
    --radiusTight:4px; --radius:6px; --radiusPanel:10px;

    /* The gaps and paddings actually in the sheet. 6 earns its place as the
       most common gap of all; without it every dense row rounds to 4 or 8. */
    --space1:4px; --space2:6px; --space3:8px;
    --space4:12px; --space5:16px; --space6:24px;

    /* Not one control rule in this sheet sets a line height, which is why the
       controls with no height at all size themselves from whatever font
       arrived. */
    --leadControl:1; --leadBody:1.6;

    /* The settings panel's own surfaces, scoped so they cannot drift into the
       app-wide roles above. */
    --setPanel:#1a1d25; --setNav:#171a21; --setInput:#14161c;
    --setBorder:#333a47; --setDiv:#282e39;
    --setLabel:#cfd4dc; --setFaint:#7d848f;
    --setOk:#57c98a; --setWarn:#e8b04b; --setBad:#ff6b6b;
  }

  /* Paper: warm off-white, thin rules, single ink accent - not a cool
     blue-grey theme, deliberately distinct in feel from Ink rather than
     just its color-inverted twin. */
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;

      --bg:#faf8f4; --panel:#fffdf9; --panel2:#fffdf9; --panel3:#f7f3ea;
      --border:#e4dfd4; --border2:#ece7dd;
      --text:#211e19; --bright:#0b0a07; --dim:#443e33; --dim2:#6f685c;
      --faint:#98907f; --faint2:#cec6b6;
      --accent:#1e46c8; --accentFg:#fffdf9;
      --green:#2f6b46; --red:#a8332a; --amber:#8a5c0c;
      --critBg:#f6e2df; --warnBg:#f6ecd8; --okBg:#e8f2ec;

      --code:#fdfbf6; --hunk:#f4f1e9; --hl:#e6ecfb;
      --addBg:#edf6f0; --delBg:#fcf1ef;
      --addText:#276039; --delText:#8f2b23;
      --greenBd:#b9d3c3; --redBd:#e0bcb7;

      --hatchA:#f4f0e7; --hatchB:#efe9de;

      --shadow:rgba(15,20,30,.10);

      --setPanel:#fffefb; --setNav:#f4f1ea; --setInput:#f4f1ea;
      --setBorder:#d9d2c2; --setDiv:#e6dfd0;
      --setLabel:#443e33; --setFaint:#938b78;
      --setOk:#12683c; --setWarn:#8a5405; --setBad:#b3241a;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    font-size: var(--textBody);
  }

  /* Reset once, here, rather than per component: a rule that only overrides
     the sides of a button it cares about (as .row does, bottom and left)
     otherwise leaves the browser's native chrome on the rest. */
  button {
    font: inherit; cursor: pointer; color: inherit;
    appearance: none; border: none; background: none;
  }

  .mono { font-family: var(--mono); }

  /* Buttons ---------------------------------------------------------------
     Nothing here sets a height, a padding, a radius or a type size. Those are
     described in web/src/ui/button.js and set inline, where no rule in this
     sheet can reach them - which is the point, because this sheet used to
     promise one button height above a rule that set eight.

     What is here is colour, and only colour. An inline declaration beats every
     :hover an author can write, so the two states that matter - hovering, and
     armed for a second click - have to live in a rule. ROLES in that file says
     what each of these must be, and test/ui/scale.test.js holds them together. */

  .ui-button {
    display: inline-flex; align-items: center; justify-content: center;
    gap: var(--space2);
    white-space: nowrap; flex-shrink: 0;
    text-decoration: none; cursor: pointer;
  }

  .ui-button--ghost { background: var(--panel2); color: var(--dim); border: 1px solid var(--border); }
  .ui-button--danger { background: var(--panel2); color: var(--red); border: 1px solid var(--redBd); }
  .ui-button--primary { background: var(--accent); color: var(--accentFg); border: none; font-weight: 700; }
  .ui-button--quiet { background: none; color: var(--faint); border: none; }
  .ui-button--icon { background: none; color: var(--dim2); border: none; }

  /* The send button wears the verdict it would send. */
  .ui-button--primary.is-ok { background: var(--green); }
  .ui-button--primary.is-critical { background: var(--red); }

  .ui-button--ghost:hover { border-color: var(--accent); color: var(--accent); }
  .ui-button--quiet:hover { color: var(--dim); }
  .ui-button--primary:hover { filter: brightness(1.08); }
  .ui-button--danger:hover { background: var(--critBg); }
  .ui-button--icon:hover { color: var(--accent); background: var(--panel3); }

  /* Arming a send is a commitment, not a hazard: it goes accent, not red.
     Arming a delete is the hazard, and says so. */
  .ui-button[data-armed="true"] { font-weight: 700; }
  .ui-button--ghost[data-armed="true"] { color: var(--accent); border-color: var(--accent); background: var(--hl); }
  .ui-button--danger[data-armed="true"], .ui-button--icon[data-armed="true"] {
    color: var(--red); background: var(--critBg);
  }

  .ui-button:disabled { opacity: .4; cursor: not-allowed; }

  /* Shell --------------------------------------------------------------- */

  #shell {
    height: 100vh;
    display: grid;
    grid-template-rows: 48px 1fr 56px;
    grid-template-columns: minmax(0, 1fr);
  }

  [hidden] { display: none !important; }

  header {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 0 14px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    min-width: 0;
  }


  header .title {
    font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    min-width: 0;
  }

  .spacer { flex: 1; }

  /* Header chips and popovers -------------------------------------------- */

  .head-slug { font-size: 9px; letter-spacing: .1em; color: var(--faint); white-space: nowrap; }

  /* Hosts stretch to the header row and chips fill them, so the two chips
     stand the same height however many lines the queue one carries. */
  .popover-host { position: relative; flex-shrink: 0; align-self: stretch; display: flex; align-items: center; padding: 7px 0; }
  .popover-host .chip { height: 100%; }

  .chip {
    display: flex; align-items: center; gap: 9px;
    min-height: 36px; padding: 4px 10px;
    border: 1px solid var(--border); border-radius: 6px;
    background: var(--panel2); color: var(--text);
    text-align: left; white-space: nowrap;
    font-family: var(--mono);
  }

  /* The open pull request reads as header text beside the chips: slug,
     title, stats, one line. */
  /* flex-basis: 0 rather than the default auto - a wrapping flex container
     decides its line breaks off each item's hypothetical (un-shrunk) size,
     and text-overflow:ellipsis only truncates at paint time, so the full,
     untruncated title width was what got measured. Signout paid for that:
     it read as not fitting the line and wrapped to its own, even though
     head-open shrinks to nothing once actually placed. */
  .head-open { display: flex; align-items: baseline; gap: 9px; flex: 1 1 0%; min-width: 0; }

  /* Not rendered unless the mobile media query below turns it into a line
     break - see .row-break there for what it is doing and why. */
  .row-break { flex-basis: 0; height: 0; }
  .head-open .head-slug { font-size: var(--textSmall); flex-shrink: 0; }
  .head-open .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .head-open .head-stats { font-size: var(--textSmall); white-space: nowrap; flex-shrink: 0; }

  .chip:hover { background: var(--panel3); }
  .chip[aria-expanded="true"] { border-color: var(--accent); }

  .chip-value { display: flex; align-items: center; gap: 6px; font-size: var(--textSmall); }

  .chip-count {
    padding: 0 5px; border-radius: 3px;
    background: var(--critBg); color: var(--red);
    font-size: var(--textMicro); font-weight: 700;
  }

  .caret { color: var(--faint); font-size: var(--textMicro); }

  /* The backdrop makes clicking away a way out, without a document listener
     that would also fire on the button that opened it. */
  .backdrop { position: fixed; inset: 0; z-index: 30; }

  .popover {
    position: absolute; top: calc(100% + 3px); left: 0; z-index: 40;
    width: 420px; max-height: 70vh; overflow-y: auto;
    border: 1px solid var(--border); border-radius: 9px;
    background: var(--panel); box-shadow: 0 18px 44px var(--shadow);
  }

  .popover-head {
    position: sticky; top: 0;
    display: flex; align-items: center; gap: 8px;
    padding: 9px 12px; border-bottom: 1px solid var(--border2);
    background: var(--panel);
    font-size: var(--textMicro); letter-spacing: .12em; text-transform: uppercase; color: var(--faint);
  }

  .popover-foot { padding: 12px; font-size: var(--textSmall); color: var(--faint); line-height: 1.6; }

  .setup-row {
    display: grid; gap: 3px; width: 100%;
    padding: 9px 12px; border: none; border-bottom: 1px solid var(--border2);
    border-left: 2px solid transparent;
    background: none; text-align: left; color: inherit;
  }

  .setup-row:hover { background: var(--panel2); }
  .setup-row[aria-current="true"] { border-left-color: var(--accent); background: var(--hl); }
  .setup-row .top { display: flex; align-items: center; gap: 8px; }
  .setup-row .name { font-size: var(--textBody); font-weight: 500; }
  .setup-row .count { margin-left: auto; font-family: var(--mono); font-size: var(--textSmall); color: var(--dim2); }
  .setup-row .dir { font-family: var(--mono); font-size: var(--textSmall); color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* A row is a switch and an edit, so the row itself cannot be one button. */
  .setup-line { display: flex; align-items: stretch; border-bottom: 1px solid var(--border2); }
  .setup-line .setup-row { flex: 1; min-width: 0; border-bottom: none; }
  .setup-line .setup-edit { align-self: center; margin-right: 10px; }

  /* The settings panel ---------------------------------------------------
     A centred modal over its own scrim: 268px of nav, the rest detail. The
     queue keeps the old anchored popover; none of these classes touch it. */

  .settings-scrim { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.45); }

  .settings {
    position: fixed; z-index: 70;
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 900px; height: 424px;
    display: grid; grid-template-columns: 268px 1fr; grid-template-rows: 1fr auto;
    border: 1px solid var(--setBorder); border-radius: 10px;
    background: var(--setPanel); overflow: hidden;
    box-shadow: 0 30px 70px var(--shadow);
  }

  .settings .is-ok { color: var(--setOk); }
  .settings .is-warn { color: var(--setWarn); }
  .settings .is-bad { color: var(--setBad); }

  .settings-nav {
    display: flex; flex-direction: column; align-items: stretch;
    min-height: 0; overflow-y: auto;
    border-right: 1px solid var(--setDiv);
    background: var(--setNav);
  }

  .settings-group {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 14px 8px;
    font-size: var(--textMicro); letter-spacing: .12em; text-transform: uppercase;
    color: var(--setFaint);
  }

  .settings-none { padding: 2px 14px 10px; font-size: var(--textSmall); color: var(--setFaint); }

  .settings-row {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 8px 14px 9px 12px;
    border-left: 2px solid transparent;
    text-align: left;
  }

  .settings-row .text { display: grid; gap: 2px; min-width: 0; }
  .settings-row .name { font-size: var(--textBody); font-weight: 500; color: var(--setLabel); }

  .settings-row .dir {
    font-size: var(--textSmall); color: var(--setFaint);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .settings-row:hover { background: color-mix(in srgb, var(--hl) 45%, transparent); }
  .settings-row[aria-current="true"] { border-left-color: var(--accent); background: var(--hl); }
  .settings-row[aria-current="true"] .name { color: var(--bright); }
  .settings-row[aria-current="true"] .dir { color: var(--dim); }
  .settings-row .dir.is-new { color: var(--accent); }

  /* What "signed in as" adds is for a screen reader; the eye gets the login. */
  .settings-row .said {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip-path: inset(50%); white-space: nowrap;
  }

  .settings-dot {
    width: 7px; height: 7px; border-radius: 50%;
    flex-shrink: 0; background: currentColor;
  }

  .settings-dot.is-ok { background: var(--setOk); }
  .settings-dot.is-warn { background: var(--setWarn); }
  .settings-dot.is-bad { background: var(--setBad); }
  .settings-dot.is-hollow { background: none; border: 1px solid var(--setBorder); }

  .settings-add { margin: 14px 12px 12px; }

  .settings-detail { display: grid; min-height: 0; }
  .settings-detail > * { grid-area: 1 / 1; min-height: 0; }

  .settings-form { display: grid; grid-template-rows: 1fr min-content; min-height: 0; }

  .settings-body {
    padding: 16px 18px; display: grid; gap: 14px; align-content: start;
    overflow-y: auto; min-height: 0;
  }

  .settings-head { display: flex; align-items: center; gap: 10px; }
  .settings-title { font-size: var(--textLead); font-weight: 600; color: var(--bright); }

  .settings-state {
    display: flex; align-items: center; gap: 5px;
    font-size: var(--textMicro); letter-spacing: .06em; text-transform: uppercase;
  }

  .settings-state .settings-dot { width: 6px; height: 6px; }

  .settings-type {
    font-size: var(--textMicro); letter-spacing: .06em; text-transform: uppercase;
    color: var(--setFaint);
  }

  .settings-remove { padding: 0; font-size: var(--textSmall); color: var(--setBad); flex-shrink: 0; }
  .settings-remove[data-armed="true"] { font-weight: 700; }

  .settings-fields {
    display: grid; grid-template-columns: 74px 1fr; gap: 10px; align-items: center;
  }

  /* Each field is a label wrapping its caption and control, flattened into
     the grid so the two columns line up across every row. */
  .settings-fields label { display: contents; }
  .settings-key { font-size: var(--textSmall); color: var(--dim); }

  .settings-set {
    margin-left: 6px; padding: 0 4px; border-radius: 3px;
    background: var(--okBg); color: var(--green);
    font-size: 9px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  }

  .settings-fields input, .settings-fields select {
    height: 34px; padding: 0 11px; min-width: 0;
    border: 1px solid var(--setBorder); border-radius: 6px;
    background: var(--setInput); color: var(--bright);
    font-family: 'IBM Plex Sans', sans-serif; font-size: var(--textBody);
  }

  .settings-fields input.mono { font-family: var(--mono); font-size: var(--textSmall); }
  .settings-fields select { width: 260px; max-width: 100%; font-family: var(--mono); font-size: var(--textSmall); }
  .settings-hint { grid-column: 2; font-size: var(--textSmall); line-height: 1.55; color: var(--setFaint); }

  /* A segmented control rather than a button: a bordered group whose children
     divide it and whose pressed one fills. It is not built on button() - it
     borrows the height, so the settings panel still has one. */
  .settings-kind {
    display: flex; width: max-content; height: var(--ctlCompact);
    border: 1px solid var(--setBorder); border-radius: 6px; overflow: hidden;
  }
  .settings-kind button { padding: 0 12px; font-size: var(--textSmall); color: var(--setFaint); }
  .settings-kind button + button { border-left: 1px solid var(--setBorder); }
  .settings-kind button[aria-pressed="true"] { background: var(--hl); color: var(--bright); }

  .settings-folder { display: flex; align-items: center; gap: 9px; min-width: 0; }

  .settings-path {
    font-size: var(--textSmall); color: var(--dim);
    min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .settings-status { font-size: var(--textSmall); line-height: 1.6; color: var(--setFaint); }

  /* The inventory of the source's folder, under the reading. Quieter than the
     status line because it never changes and never needs acting on: it is
     there to be checked once, not watched. */
  .settings-work { display: grid; gap: 3px; margin-top: -4px; }
  .settings-work-at { font-size: var(--textMicro); letter-spacing: .04em; color: var(--faint2); }
  .settings-work-row { display: flex; align-items: baseline; gap: 10px; }

  .settings-work-path {
    flex-shrink: 0; width: 168px;
    font-size: var(--textSmall); color: var(--setLabel);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .settings-work-doing { font-size: var(--textSmall); line-height: 1.55; color: var(--faint); }

  .settings-foot {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 18px;
    border-top: 1px solid var(--setDiv);
    background: var(--setNav);
  }

  .settings-word { font-size: var(--textSmall); color: var(--setFaint); }

  .settings-blank { display: grid; place-items: center; padding: 40px; font-size: var(--textSmall); color: var(--setFaint); text-align: center; }

  .settings-teach { display: grid; align-content: center; justify-content: center; padding: 26px 30px; overflow-y: auto; }
  .settings-teach { gap: 16px; max-width: 580px; }
  .teach-intro { display: grid; gap: 6px; }
  .teach-title { font-size: var(--textLead); font-weight: 600; color: var(--bright); }
  .teach-text { font-size: var(--textBody); line-height: 1.65; color: var(--dim); text-wrap: pretty; }

  .teach-halves { display: grid; grid-template-columns: 1fr 22px 1fr; align-items: stretch; }

  .teach-card {
    display: grid; gap: 6px; align-content: start;
    padding: 12px 13px;
    border: 1px solid var(--setBorder); border-radius: 8px;
    background: var(--setInput);
  }

  .teach-card .kicker { font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--setFaint); }
  .teach-card .what { font-size: var(--textBody); font-weight: 500; color: var(--bright); }
  .teach-card .how { font-size: var(--textSmall); line-height: 1.55; color: var(--dim); }

  .teach-joint { position: relative; }
  .teach-joint::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--setBorder); }

  .teach-actions { display: flex; align-items: center; gap: 9px; }
  .teach-actions .either { font-size: var(--textSmall); color: var(--setFaint); }

  main { display: grid; grid-template-columns: 300px 1fr; min-height: 0; }

  .pane { border-right: 1px solid var(--border); background: var(--panel); min-height: 0; overflow-y: auto; }

  .pane-head {
    display: flex; align-items: center; gap: 8px;
    padding: 0 12px; height: 34px;
    border-bottom: 1px solid var(--border2);
    font-family: var(--mono); font-size: var(--textMicro);
    letter-spacing: .12em; text-transform: uppercase; color: var(--faint);
    position: sticky; top: 0; background: var(--panel); z-index: 1;
  }

  /* Queue --------------------------------------------------------------- */

  .row {
    display: grid; gap: 6px;
    padding: 10px 12px 11px;
    border-bottom: 1px solid var(--border2);
    border-left: 2px solid transparent;
    cursor: pointer;
    width: 100%;
    text-align: left;
    background: none;
    color: inherit;
  }

  .row:hover { background: var(--panel2); }
  .row[aria-current="true"] { background: var(--hl); border-left-color: var(--accent); }

  .row-top { display: flex; gap: 7px; align-items: baseline; }

  .avatar {
    width: 15px; height: 15px; border-radius: 50%;
    background: var(--accent); color: var(--accentFg);
    display: grid; place-items: center;
    font-size: 8px; font-weight: 700;
    flex-shrink: 0;
  }

  .who { display: flex; align-items: center; gap: 4px; }

  .bars { display: flex; gap: 3px; }
  .bars span { height: 3px; flex: 1; border-radius: 2px; background: var(--faint2); }
  .bars .is-neutral  { background: var(--dim2); }
  .bars .is-ok       { background: var(--green); }
  .bars .is-warn     { background: var(--amber); }
  .bars .is-critical { background: var(--red); }
  .bars .is-accent   { background: var(--accent); }
  .ready-dot { color: var(--green); font-size: 8px; align-self: center; }

  .flag-toggle {
    display: flex; align-items: center; gap: 5px;
    font-family: var(--mono); font-size: 9.5px;
    letter-spacing: .08em; text-transform: uppercase; color: var(--dim2);
  }

  .flag-toggle .box {
    width: 11px; height: 11px; border-radius: 3px;
    border: 1px solid var(--border); background: var(--panel2);
  }

  .flag-toggle[aria-pressed="true"] { color: var(--accent); }
  .flag-toggle[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); }
  .row-title { font-weight: 500; line-height: 1.35; text-wrap: pretty; }
  .row-repo { font-family: var(--mono); font-size: var(--textSmall); color: var(--dim2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-meta { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: var(--textSmall); color: var(--dim2); }

  .state { font-size: var(--textMicro); letter-spacing: .06em; text-transform: uppercase; }
  .state.drafted { color: var(--green); }
  .state.approve { color: var(--green); }
  .state.comment { color: var(--accent); }
  .state.request_changes { color: var(--red); }
  .state.pending { color: var(--faint); }
  .state.posted { color: var(--accent); }

  /* Analysis ------------------------------------------------------------ */

  .card { margin: 12px; padding: 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel2); display: grid; gap: 8px; }

  /* The rail and category lists sit flat on the pane - boxes are for the
     content pane's cards, not the sidebar's controls. */
  .rail { display: grid; gap: 2px; padding: 8px 0 10px; }

  /* The blurb above the tabs: verdict line, then provenance in one quiet
     row - author and age left, the pull request link right. */
  .rail-summary { gap: 8px; padding: 12px 16px 14px; border-left: none; }
  .rail-summary .summary { padding: 0; color: var(--text); }
  .rail-summary .provenance { display: grid; gap: 3px; justify-items: start; }
  .rail-summary .provenance .summary-meta { white-space: nowrap; }

  .card-head { font-family: var(--mono); font-size: var(--textMicro); letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }

  /* Nothing has been drafted yet. Distinct from isDrafting, which means a
     draft exists and is still being written; this is the state before that,
     where the sweep has not picked the pull request up at all. */
  .rail-waiting { padding: 8px 12px; font-family: var(--mono); font-size: var(--textSmall); color: var(--faint); }

  /* Section rows double as the pane's filters. Colour is a named token the
     drafting agent picks; the app maps it here, so no draft can be unreadable. */

  .lens {
    display: flex; gap: 8px; align-items: center; width: 100%;
    padding: 5px 12px; border: none; border-left: 2px solid transparent;
    background: none; text-align: left;
    font-family: var(--mono); font-size: var(--textSmall); color: var(--dim);
  }

  .lens:hover { background: var(--panel2); }
  .lens[aria-pressed="true"] { border-left-color: var(--accent); background: var(--hl); color: var(--bright); }

  .lens .glyph { width: 9px; color: var(--tone, var(--dim2)); }
  .lens .count { margin-left: auto; color: var(--tone, var(--dim2)); }

  .is-neutral  { --tone: var(--dim2); }
  .is-ok       { --tone: var(--green); }
  .is-warn     { --tone: var(--amber); }
  .is-critical { --tone: var(--red); }
  .is-accent   { --tone: var(--accent); }

  .card-head.is-ok, .card-head.is-warn,
  .card-head.is-critical, .card-head.is-accent { color: var(--tone); }

  .summary { font-size: var(--textBody); line-height: 1.55; color: var(--dim); text-wrap: pretty; padding-top: 2px; }
  .summary-meta { font-size: var(--textSmall); color: var(--dim2); }
  .pull-link { color: var(--accent); text-decoration: none; }
  .pull-link:hover { text-decoration: underline; }
  .pull-line { display: flex; align-items: center; gap: 6px; }

  .copy-url, .clear-review { transition: color .15s ease, background .15s ease; }
  .copy-url svg, .clear-review svg { display: block; }

  /* It said so itself, where the eye already is. */
  .copy-url.is-copied { color: var(--green); background: var(--okBg); }

  /* Armed, the glyph is replaced by the word "Delete?", which is smaller than
     a label because the square it grows out of is 20px. */
  .clear-review[data-armed="true"] { font-size: var(--textMicro); }

  .lens-body { font-size: var(--textBody); line-height: 1.6; color: var(--dim); }
  .lens-body ul, .lens-body ol { padding-left: 18px; margin: 6px 0; }
  .lens-body li { margin: 5px 0; }
  .lens-body strong { color: var(--bright); }
  .lens-note { padding: 12px; border-bottom: 1px solid var(--border2); background: var(--panel2); }

  /* Comment ------------------------------------------------------------- */

  #comment { background: var(--bg); overflow-y: auto; min-height: 0; padding: 0 0 40px; }


  /* A comfortable reading measure - roughly 70 characters - rather than
     lines that run the full width of a wide window. Every tab holds it, so
     switching between summary, diff and QA never reflows the eye. */
  #tab-summary, #tab-diff, #tab-qa { max-width: 44rem; }

  /* Editing sits in flow beside the prose it edits - nothing can cover
     it, and it takes no space at all while hidden. */
  #tab-summary { position: relative; }

  #comment-notes:empty, #comment-cards:empty, #comment-extra:empty { display: none; }

  .posted-note {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 14px; padding: 9px 12px;
    border: 1px solid var(--greenBd); border-radius: 6px;
    background: var(--okBg); color: var(--green);
    font-size: var(--textSmall); text-decoration: none;
  }

  .posted-note:hover { text-decoration: underline; }

  /* The summary is its own box, and the box is the way into writing it:
     there is no edit button, so the border and its hover are what say the
     words can be changed. A box nobody may change loses the invitation. */
  .summary-box {
    position: relative;
    display: block; width: 100%; text-align: left;
    padding: 16px 18px; border: 1px solid var(--border); border-radius: 8px;
    color: inherit; font: inherit;
  }

  .summary-box.is-blank {
    display: grid; gap: 4px;
    border-style: dashed; text-align: center;
  }

  .summary-box .title { font-weight: 600; color: var(--dim); }
  .summary-box .text { font-size: var(--textSmall); color: var(--faint); }

  .summary-box[role="button"], button.summary-box { cursor: text; }

  .summary-box[role="button"]:hover, button.summary-box:hover {
    border-color: var(--accent); background: var(--panel2);
  }

  button.summary-box:hover .title { color: var(--accent); }

  /* Quiet until the box itself says it is being considered. The title
     attribute already gives this to a screen reader, so this is decoration
     for the eye that is already looking. */
  .summary-edit-hint {
    position: absolute; top: 14px; right: 16px;
    font-family: var(--mono); font-size: var(--textMicro); letter-spacing: .08em;
    text-transform: uppercase; color: var(--faint);
    opacity: 0; transition: opacity .15s ease; pointer-events: none;
  }

  .summary-box[role="button"]:hover .summary-edit-hint,
  .summary-box[role="button"]:focus-visible .summary-edit-hint {
    opacity: 1;
  }

  #comment-notes { padding-bottom: 0; }
  #comment-cards { padding-bottom: 0; }
  #comment-extra { padding-top: 0; }

  /* An empty state owns the whole pane and centers in it. */
  #tab-summary:has(.empty) { max-width: none; height: 100%; }
  #comment-body:has(> .empty) { height: 100%; padding: 0; }

  .prose { padding: 20px 24px; font-size: var(--textBody); line-height: 1.65; }

  .prose h3 { font-size: var(--textSmall); letter-spacing: .06em; text-transform: uppercase; color: var(--faint); margin: 26px 0 10px; }
  .prose ol, .prose ul { padding-left: 20px; }
  .prose li { margin: 10px 0; }
  .prose code { font-family: var(--mono); font-size: .88em; background: color-mix(in srgb, currentColor 10%, transparent); padding: .15em .35em; border-radius: 4px; }
  /* Markdown code fences only - the finding cards' own pre blocks (code
     excerpts, suggestions) carry their own styling even inside the prose. */
  .prose pre:not(.finding-code):not(.suggestion pre) { background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; padding: 12px; overflow-x: auto; }
  .prose pre code { background: none; padding: 0; }

  .prose table { border-collapse: collapse; margin: 12px 0; font-size: .92em; }
  .prose th, .prose td { padding: 6px 10px; border: 1px solid var(--border); text-align: left; vertical-align: top; }
  .prose th { background: var(--panel3); font-weight: 600; }

  /* The container's padding is the spacing; the first paragraph's own margin
     would double it, everywhere a rendered body starts with one. */
  .prose > :first-child, .prose > div > :first-child,
  .qa-note > :first-child, .lens-body > :first-child { margin-top: 0; }
  .prose > :last-child, .qa-note > :last-child, .lens-body > :last-child { margin-bottom: 0; }
  .prose a { color: var(--accent); }
  .prose strong { color: var(--bright); }

  #editor {
    width: calc(100% - 40px);
    margin: 16px 20px;
    min-height: 60vh;
    padding: 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--panel2);
    color: var(--text);
    font-family: var(--mono);
    font-size: var(--textBody);
    line-height: 1.7;
    resize: vertical;
  }

  .empty {
    height: 100%; display: grid; place-items: center; padding: 40px;
  }

  .empty-inner {
    max-width: 400px; text-align: center;
    display: grid; gap: 10px; justify-items: center;
  }

  .empty-mark {
    width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--panel2);
    display: grid; place-items: center;
    color: var(--dim2); font-family: var(--mono); font-size: var(--textLead);
  }

  .empty-title { font-size: var(--textLead); font-weight: 600; color: var(--text); }

  .progress {
    width: 220px; height: 4px; border-radius: 2px;
    background: var(--panel3); overflow: hidden;
  }

  .progress span { display: block; height: 100%; background: var(--accent); transition: width .4s ease; }

  /* A readable-but-unfinished review carries this above its prose. */
  .wip {
    display: flex; align-items: center; gap: 9px;
    margin-bottom: 14px; padding: 8px 12px;
    border: 1px dashed var(--border); border-radius: 6px;
    font-size: var(--textSmall); color: var(--dim2);
  }

  .wip .progress { width: 120px; margin-left: auto; flex-shrink: 0; }
  .empty-text { font-size: var(--textBody); line-height: 1.6; color: var(--dim2); text-wrap: pretty; }

  /* Files list ---------------------------------------------------------- */

  .file {
    display: flex; align-items: center; gap: 7px; width: 100%;
    padding: 8px 12px; border: none; border-left: 2px solid transparent;
    background: none; text-align: left;
    font-family: var(--mono); font-size: var(--textSmall); color: var(--dim);
  }

  .file:hover { background: var(--panel2); }
  .file[aria-pressed="true"] { border-left-color: var(--accent); background: var(--hl); color: var(--bright); }
  .file .path { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file .n {
    margin-left: auto; flex-shrink: 0;
    padding: 0 5px; border-radius: 3px;
    background: var(--panel3); color: var(--tone, var(--dim2));
    font-size: var(--textMicro); font-weight: 700;
  }

  .file .n.is-critical { background: var(--critBg); }
  .file .n.is-warn { background: var(--warnBg); }
  .file .n.is-ok { background: var(--okBg); }

  .file .adds { flex-shrink: 0; color: var(--green); font-size: var(--textMicro); }
  .file .dels { flex-shrink: 0; color: var(--red); font-size: var(--textMicro); }

  .filter-hint .path { color: var(--faint); font-style: italic; }
  .filter-hint .show { flex-shrink: 0; color: var(--accent); }

  /* Diff ---------------------------------------------------------------- */

  .diff-file { margin-bottom: 8px; }

  .diff-head {
    position: sticky; top: 0; z-index: 2;
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 9px 14px;
    border: none;
    border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    background: var(--panel);
    text-align: left;
    font-family: var(--mono); font-size: var(--textSmall); color: var(--bright);
  }

  .diff-head:hover { background: var(--panel2); }
  .diff-head .caret { color: var(--faint); width: 10px; }
  .diff-head .adds { color: var(--green); }
  .diff-head .dels { color: var(--red); }

  .viewed {
    display: flex; align-items: center; gap: 6px; flex-shrink: 0;
    padding: 0; border: none; background: none;
    font-family: var(--mono); font-size: var(--textSmall); color: var(--faint);
  }

  .viewed .box {
    width: 12px; height: 12px; border-radius: 3px;
    border: 1px solid var(--faint2);
    display: grid; place-items: center;
    font-size: 9px; color: var(--accentFg);
  }

  .viewed[aria-pressed="true"] { color: var(--accent); }
  .viewed[aria-pressed="true"] .box { border-color: var(--accent); background: var(--accent); }
  .diff-file.is-viewed .line, .diff-file.is-viewed .hunk-head { opacity: .45; }

  .hunk-head {
    padding: 2px 14px;
    background: var(--hunk); color: var(--faint);
    font-family: var(--mono); font-size: var(--textSmall);
  }

  .line {
    display: grid; grid-template-columns: 46px 46px 1fr;
    font-family: var(--mono); font-size: var(--textSmall); line-height: 1.7;
  }

  .line .old, .line .new {
    text-align: right; padding-right: 10px; color: var(--faint2);
    cursor: pointer; user-select: none;
  }

  .line .new:hover { background: var(--hl); color: var(--accent); }
  .line .text { padding-left: 8px; white-space: pre-wrap; }
  .line.add { background: var(--addBg); color: var(--addText); }
  .line.del { background: var(--delBg); color: var(--delText); }
  .line.anchored { box-shadow: inset 2px 0 0 var(--accent); }

  /* Inline findings ----------------------------------------------------- */

  .finding {
    margin: 8px 14px 14px 46px;
    border: 1px solid var(--border); border-radius: 7px;
    background: var(--panel2); overflow: hidden;
  }

  /* The gutter indent belongs to the diff, where a card hangs under its
     line; in the summary and the confirmation sheet the cards sit flush,
     spaced from each other but not indented. */
  .prose .finding { margin: 14px 0; }

  .finding.is-dropped { opacity: .45; }
  .finding.is-critical { border-color: var(--redBd); }
  .finding.is-ok { border-color: var(--greenBd); }

  .finding-head {
    display: flex; align-items: center; gap: 9px;
    padding: 9px 12px; background: var(--panel3);
    border-bottom: 1px solid var(--border2);
    font-family: var(--mono); font-size: var(--textSmall); color: var(--dim);
  }

  .finding-head .sent { color: var(--green); font-size: var(--textMicro); }

  .finding.is-posted { opacity: .72; }

  .finding-head .kind {
    padding: 1px 6px; border-radius: 3px;
    font-size: var(--textMicro); font-weight: 700;
    background: var(--panel); color: var(--tone, var(--dim2));
  }

  .finding-head .anchor { color: var(--faint); }
  /* Flush with the card: no inner box, the line tints run edge to edge. */
  .finding-code {
    margin: 0; padding: 0;
    background: var(--code); border-bottom: 1px solid var(--border2);
    font-size: var(--textSmall); line-height: 1.7; color: var(--dim);
    white-space: pre-wrap; overflow-x: auto;
  }

  .finding-code .code-line { padding: 1px 12px; }

  .finding-code .code-line.add { background: var(--addBg); color: var(--addText); }
  .finding-code .code-line.del { background: var(--delBg); color: var(--delText); }

  .finding-body { padding: 11px 12px; display: grid; gap: 10px; font-size: var(--textBody); line-height: 1.6; }

  /* Long unbroken content - env lines, checklists, urls - scrolls inside
     its block instead of stretching the card past its pane. Grid and flex
     children only shrink when told they may. */
  .finding, .finding-body, .finding-body > * { min-width: 0; }
  .finding-body pre { max-width: 100%; overflow-x: auto; }
  .finding-body { overflow-wrap: break-word; }
  .finding-body p { margin: 0 0 10px; }
  .finding-body p:last-child { margin-bottom: 0; }
  .finding-body code { font-family: var(--mono); font-size: .88em; background: color-mix(in srgb, currentColor 10%, transparent); padding: .15em .35em; border-radius: 4px; }
  .prose { overflow-wrap: break-word; }

  .suggestion { border: 1px solid var(--border); border-radius: 5px; background: var(--code); overflow: hidden; }
  .suggestion-head { padding: 5px 10px; border-bottom: 1px solid var(--border2); font-family: var(--mono); font-size: var(--textMicro); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
  .suggestion pre { margin: 0; padding: 6px 10px; background: var(--addBg); color: var(--addText); font-family: var(--mono); font-size: var(--textSmall); line-height: 1.7; white-space: pre-wrap; }

  .finding-actions { display: flex; gap: 6px; align-items: center; font-family: var(--mono); font-size: var(--textSmall); }

  .finding-editor {
    width: 100%; min-height: 18rem; padding: 9px 10px;
    border: 1px solid var(--accent); border-radius: 5px;
    background: var(--bg); color: var(--text);
    font-size: var(--textBody); line-height: 1.7; resize: vertical;
  }

  /* QA evidence ---------------------------------------------------------- */

  .qa-head {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px 8px;
    font-family: var(--mono); font-size: var(--textMicro);
    letter-spacing: .1em; text-transform: uppercase; color: var(--faint);
  }

  .qa-head .note { letter-spacing: .04em; text-transform: none; color: var(--dim2); }

  .scenario {
    margin: 0 16px 14px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--panel2); overflow: hidden;
  }

  /* In the summary the prose padding is already the left edge - the QA
     pieces keep their own spacing only in their own tab. */
  .prose .qa-head { padding: 14px 0 8px; }
  .prose .scenario { margin: 0 0 14px; }
  .prose .qa-note { padding: 4px 0; margin-bottom: 0; }

  .scenario-head {
    display: flex; align-items: center; gap: 9px;
    padding: 9px 12px; border-bottom: 1px solid var(--border2);
    font-family: var(--mono); font-size: var(--textSmall);
  }

  .scenario-head .glyph { color: var(--tone, var(--dim2)); flex-shrink: 0; }
  .scenario-head .url { color: var(--bright); }
  .scenario-head .what { font-family: 'IBM Plex Sans', sans-serif; font-size: var(--textBody); color: var(--dim); }
  .scenario-head .verdict {
    margin-left: auto; flex-shrink: 0;
    font-size: var(--textMicro); letter-spacing: .06em; text-transform: uppercase;
    color: var(--tone, var(--dim2));
  }

  .scenario video { display: block; width: 100%; max-height: 420px; background: #000; }

  .scenario-missing {
    height: 140px; display: grid; place-items: center;
    background: repeating-linear-gradient(135deg, var(--panel3) 0 8px, var(--panel2) 8px 16px);
    font-family: var(--mono); font-size: var(--textSmall); color: var(--faint);
  }

  .scenario-foot {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; border-top: 1px solid var(--border2);
    font-family: var(--mono); font-size: var(--textSmall); color: var(--faint);
  }

  .add-comment {
    margin: 8px 14px 14px 46px;
    border: 1px solid var(--accent); border-radius: 7px;
    background: var(--panel2); padding: 11px 12px;
    display: grid; gap: 10px;
  }

  .add-hint {
    margin: 12px 14px 24px 46px;
    display: flex; align-items: center; gap: 9px;
    padding: 8px 12px;
    border: 1px dashed var(--border); border-radius: 7px;
    font-family: var(--mono); font-size: var(--textSmall); color: var(--faint);
  }

  .add-hint .plus { color: var(--accent); }

  .filter-empty {
    margin: 0 14px 24px; padding: 14px;
    border: 1px dashed var(--border); border-radius: 7px;
    display: grid; gap: 6px;
  }

  .filter-empty .title { font-size: var(--textBody); font-weight: 500; }
  .filter-empty .text { font-size: var(--textBody); line-height: 1.6; color: var(--dim2); }

  /* The QA note reads as prose, like the summary - not a boxed aside. */
  .qa-note {
    margin: 0 0 40px; padding: 4px 24px;
    font-size: var(--textBody); line-height: 1.65; color: var(--text);
  }

  .qa-note code, .lens-body code {
    font-family: var(--mono); font-size: .88em;
    background: color-mix(in srgb, currentColor 10%, transparent);
    padding: .15em .35em; border-radius: 4px;
  }

  .finding-head .edited {
    padding: 1px 6px; border-radius: 3px;
    background: var(--warnBg); color: var(--amber);
    font-size: var(--textMicro); font-weight: 700;
  }

  /* Footer -------------------------------------------------------------- */

  footer {
    display: flex; align-items: center; gap: 12px;
    padding: 0 16px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }

  .payload {
    display: grid; gap: 2px;
    font-family: var(--mono);
    white-space: nowrap; flex-shrink: 0;
  }

  .payload #staged { font-size: var(--textSmall); color: var(--dim); }
  .payload #counts { font-size: var(--textSmall); color: var(--faint); }

  .fdivider { width: 1px; height: 26px; background: var(--border); flex-shrink: 0; }

  /* A segmented control, not a button: one control holding three or four
     choices, dividing itself between the ones on show. It borrows the standard
     height so the footer has one, and nothing else. */
  .verdicts {
    display: flex; height: var(--ctlStandard);
    border: 1px solid var(--faint2); border-radius: 7px;
    background: var(--panel2); overflow: hidden;
    white-space: nowrap; flex-shrink: 0;
  }

  .verdicts button {
    display: flex; align-items: center; gap: 7px;
    padding: 0 12px;
    border: none;
    background: transparent; color: var(--text);
    font-family: var(--mono); font-size: var(--textSmall); font-weight: 500;
    white-space: nowrap;
  }

  /* A divider between the buttons on show. Which those are changes with whose
     pull request it is, so the rule follows the ones still standing rather
     than counting on the first and last never being hidden. */
  .verdicts button:not([hidden]) ~ button:not([hidden]) {
    border-left: 1px solid var(--faint2);
  }

  .verdicts .dot {
    width: 11px; height: 11px; border-radius: 50%;
    border: 1.5px solid var(--dim2); flex-shrink: 0;
  }

  .verdicts button[aria-pressed="true"] {
    background: color-mix(in srgb, var(--accent) 18%, var(--panel2));
    color: var(--bright);
  }

  .verdicts button[aria-pressed="true"] .dot {
    border-width: 3.5px; border-color: var(--accent); background: var(--bg);
  }

  .consequence {
    font-family: var(--mono); font-size: var(--textSmall); color: var(--faint);
    white-space: nowrap;
  }

  .consequence.is-warn { color: var(--amber); }

  /* Confirmation ------------------------------------------------------- */

  #celebrate { z-index: 95; }

  #confetti { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  .cheer {
    position: relative; text-align: center;
    display: grid; gap: 10px; justify-items: center;
    padding: 36px 44px;
    border: 1px solid var(--border); border-radius: 12px;
    background: var(--panel); box-shadow: 0 30px 70px var(--shadow);
  }

  .cheer-mark { font-size: 34px; }
  .cheer-title { font-size: var(--textDisplay); font-weight: 700; color: var(--bright); }
  .cheer-done { font-size: var(--textSmall); color: var(--dim2); }
  #cheer-pr { font-size: var(--textLead); color: var(--dim); max-width: 30rem; }
  /* Crossing it off is the "done, and gone" signal, so it is only worn by a
     review that actually left. */
  .cheer-struck { text-decoration: line-through; text-decoration-color: var(--green); text-decoration-thickness: 2px; }
  .cheer-link { font-size: var(--textSmall); color: var(--accent); text-decoration: none; }
  .cheer-link:hover { text-decoration: underline; }
  .cheer-note { font-size: var(--textBody); color: var(--dim); max-width: 26rem; line-height: 1.5; }

  /* The invitation a destination that sent nothing offers instead of a link to
     what it did not send. It is the one thing being asked for on the page, so
     it is the primary action, and an anchor because it navigates. */
  .cheer-cta { margin-top: 4px; }
  .cheer-actions { display: flex; gap: 8px; margin-top: 10px; }

  #confirm, .scrim {
    position: fixed; inset: 0; z-index: 90;
    background: rgba(0,0,0,.45);
    display: grid; place-items: center; padding: 40px;
  }

  .sheet {
    width: min(720px, 100%); max-height: 84vh;
    display: grid; grid-template-rows: auto 1fr auto auto;
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--panel); overflow: hidden;
    box-shadow: 0 30px 70px var(--shadow);
  }

  .sheet-body { overflow-y: auto; }

  .sheet-head { padding: 14px 18px; border-bottom: 1px solid var(--border2); display: grid; gap: 5px; }
  .sheet-title { display: flex; align-items: center; gap: 10px; }
  .sheet-title .h { font-size: var(--textLead); font-weight: 600; }
  .sheet-count { font-size: var(--textSmall); color: var(--dim2); }

  .verdict-badge {
    padding: 1px 7px; border-radius: 3px;
    font-size: var(--textMicro); font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    color: var(--tone, var(--dim)); border: 1px solid var(--tone, var(--border));
  }

  .sheet-foot {
    padding: 12px 18px; border-top: 1px solid var(--border2);
    display: flex; align-items: center; gap: 10px; background: var(--panel3);
  }

  #confirm-note { font-size: var(--textSmall); color: var(--faint); }

  #confirm-post .spin {
    display: inline-block; vertical-align: -2px;
    width: 11px; height: 11px; margin-right: 7px;
    border: 2px solid var(--accentFg); border-top-color: transparent;
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* The curtain ----------------------------------------------------------
     Up in the markup rather than raised by script, because the frame it
     exists to cover is the first one - the shell underneath says "none" and
     "nothing to review" in hardcoded text, and a reader who sees that while
     the source and the queue are still being fetched has been told something
     untrue. It comes down once, when the whole interface is behind it. */

  #curtain {
    position: fixed; inset: 0; z-index: 100;
    display: grid; place-items: center;
    background: var(--bg);
  }

  .curtain-inner { display: grid; gap: 14px; justify-items: center; }

  .curtain-mark {
    width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--panel2);
    display: grid; place-items: center;
    color: var(--dim2); font-family: var(--mono); font-size: var(--textLead);
  }

  .curtain-word {
    font-family: var(--mono); font-size: var(--textMicro);
    letter-spacing: .12em; text-transform: uppercase; color: var(--faint);
  }

  /* Indeterminate, because nothing here knows how far along it is. Claiming a
     percentage would be the same lie the shell underneath used to tell. */
  .curtain-bar {
    width: 180px; height: 3px; border-radius: 2px;
    background: var(--panel3); overflow: hidden;
  }

  .curtain-bar span {
    display: block; width: 40%; height: 100%;
    border-radius: 2px; background: var(--accent);
    animation: sweep 1.15s ease-in-out infinite;
  }

  @keyframes sweep {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
  }

  /* Reduced motion gets the same bar, still, rather than no bar: it is the
     thing on screen saying the app is working. */
  @media (prefers-reduced-motion: reduce) {
    .curtain-bar span { width: 100%; animation: none; opacity: .35; }
  }

  @media (prefers-reduced-motion: reduce) {
    #confirm-post .spin { animation: none; border-top-color: var(--accentFg); opacity: .5; }
  }

  #confirm-post:disabled { opacity: .75; cursor: wait; }

  #status { font-family: var(--mono); font-size: var(--textSmall); color: var(--faint); }
  #status.error { color: var(--red); }
  #status.ok { color: var(--green); }

  /* Saying it where it can be seen ---------------------------------------
     The footer line above is behind every overlay this app raises: three
     scrims grey it out, and the start up curtain is opaque. So each overlay
     carries the same report, in front of itself, and takes up no room until
     there is something to report. */
  #curtain-say, #celebrate-say, #confirm-say, #setup-say {
    font-family: var(--mono); font-size: var(--textSmall); line-height: 1.55;
    color: var(--faint); text-align: center;
  }

  #curtain-say.error, #celebrate-say.error, #confirm-say.error, #setup-say.error { color: var(--red); }
  #curtain-say.ok, #celebrate-say.ok, #confirm-say.ok, #setup-say.ok { color: var(--green); }

  #curtain-say:empty, #celebrate-say:empty, #confirm-say:empty, #setup-say:empty { display: none; }

  #curtain-say, #celebrate-say { max-width: 44ch; }

  #confirm-say {
    padding: 9px 18px; text-align: left;
    border-top: 1px solid var(--border2);
  }

  /* Across both columns, along the bottom of the panel, where the buttons
     that raise these failures already are. */
  #setup-say {
    grid-column: 1 / -1;
    padding: 9px 18px; text-align: left;
    border-top: 1px solid var(--setDiv); background: var(--setNav);
  }

  /* Scrolling ------------------------------------------------------------
     Every scroller in here keeps its scrolling to itself. This app is
     embedded in a page it does not own, and reaching the bottom of the rail
     must not carry on scrolling that page, or bounce the viewport on a
     phone. Named one by one rather than with a wildcard, so the list stays
     the same list as the overflow rules above. */
  body,
  main,
  .pane,
  .popover,
  .settings-nav,
  .settings-body,
  .sheet-body,
  #comment,
  #editor,
  .finding-code,
  .finding-body pre,
  .prose pre:not(.finding-code):not(.suggestion pre) {
    overscroll-behavior: contain;
  }

  /* A narrow viewport ----------------------------------------------------
     The app on a phone, and inside a marketing page being read on one. One
     column, with the queue above the review and capped so the review is
     still most of what is on screen. Rows grow to fit rather than clipping
     what wrapped. Nothing outside this block changes. */
  @media (max-width: 760px) {
    #shell { grid-template-rows: auto 1fr auto; }

    header, footer {
      flex-wrap: wrap;
      height: auto;
      row-gap: 6px;
      padding-top: 6px; padding-bottom: 6px;
    }

    /* The chips alone are wider than this line has room to also fit the
       open pull request and signout beside, so something has to move to
       a line of its own - and left alone, it was signout: the one item
       here that cannot shrink, so it lost whatever scraps were left over
       after head-open squeezed down. Forcing the break here instead, on
       a dedicated empty item, means head-open and signout share the new
       line together rather than head-open claiming the whole width of it. */
    .row-break { flex-basis: 100%; }

    main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }

    .pane {
      max-height: 40vh;
      overflow-y: auto;
      border-right: none;
      border-bottom: 1px solid var(--border);
    }

    /* A popover anchored to its own chip (left:0 of .popover-host) runs off
       the right edge of a phone screen the moment that chip is not itself
       flush with the left edge - which neither the source nor the queue chip
       is. Anchoring to the header instead, which always spans the full
       width, keeps every popover inside the viewport regardless of which
       chip opened it. */
    header { position: relative; }
    .popover-host { position: static; }

    .popover {
      position: absolute;
      top: 100%; left: 12px; right: 12px;
      width: auto; margin-top: 3px;
    }

    .settings {
      width: min(900px, calc(100vw - 24px));
      height: auto; max-height: 90vh;
      grid-template-columns: 1fr; grid-template-rows: auto 1fr auto;
      overflow-y: auto;
    }

    .settings-nav { border-right: none; border-bottom: 1px solid var(--setDiv); }

    #confirm, .scrim { padding: 12px; }

    .verdicts { height: var(--ctlCompact); }
    .verdicts button { gap: 5px; padding: 0 8px; font-size: 11px; }

    /* Touch targets and type, scaled up for a finger rather than a cursor.
       Desktop keeps its own sizing untouched above; this block is the only
       place any of it changes. Three heights become the touch-friendly
       trio Apple and Google both call the floor for a tappable control -
       every button already built on them (ROLES in button.js, the verdicts
       segmented control, the chips) grows with no rule but this one.

       Type moves the same way: every selector in this sheet already reads
       its size off --textMicro/Small/Body/Lead/Display, so raising the five
       here raises the whole app in one place instead of chasing one-off
       rules per selector. Only the rows a thumb taps (.lens, .file,
       .diff-head) get a further explicit step up to --textBody, so the list
       a phone is scrolled with reads at the same size as the prose it is
       held up to read - not the smaller size everything else in that row's
       chrome (chips, buttons, badges) still shares. */
    :root {
      --ctlIcon: 32px; --ctlCompact: 40px; --ctlStandard: 44px;
      --textMicro: 12px; --textSmall: 13px; --textBody: 15px;
      --textLead: 16px; --textDisplay: 19px;
    }

    .chip { min-height: 44px; }
    .lens, .file, .diff-head { min-height: 44px; font-size: var(--textBody); }
    .flag-toggle, .viewed { min-height: 44px; }

    /* iOS Safari zooms the page in on focus of any text control under 16px.
       That is not a stylistic choice to preserve - it is a bug the desktop
       sizes happen to trigger, so every text control mobile can focus is
       raised to the threshold that keeps the page still. Set as a literal
       16 rather than var(--textLead): this is a hard technical floor, not a
       type-scale choice, and must not follow --textLead if that token is
       ever tuned to something smaller. */
    .settings-fields input,
    .settings-fields select,
    .settings-fields input.mono,
    #editor,
    .finding-editor {
      font-size: 16px;
    }
  }
</style>
</head>
<body>

<div id="curtain">
  <div class="curtain-inner">
    <div class="curtain-mark mono">&#9679;</div>
    <div class="curtain-bar"><span></span></div>
    <div class="curtain-word">loading</div>
    <!-- Start up carries on past a failure, so the word above stays true and
         this says what went wrong underneath it. -->
    <div id="curtain-say" aria-hidden="true"></div>
  </div>
</div>

<div id="shell">
  <header>

    <div class="popover-host">
      <button class="chip" id="source-button" aria-expanded="false">
        <span class="chip-value" id="source-name">none</span>
        <span class="caret">&#9662;</span>
      </button>
    </div>

    <div class="popover-host">
      <button class="chip" id="queue-button" aria-expanded="false">
        <span class="chip-value mono">
          <span id="queue-waiting">nothing to review</span>
          <span class="chip-count mono" id="queue-ready" hidden></span>
        </span>
        <span class="caret">&#9662;</span>
      </button>

      <div class="backdrop" id="queue-backdrop" hidden></div>
      <div class="popover" id="queue-popover" hidden>
        <div class="popover-head mono">
          <span>requested of you</span>
          <span class="spacer"></span>
          <span id="queue-count" style="letter-spacing: .04em; text-transform: none"></span>
        </div>
        <div id="queue"></div>
        <div class="popover-foot mono" id="queue-foot"></div>
        <!-- Empty and hidden until something has been dismissed, so the way
             back exists exactly when there is something to go back to. -->
        <div id="dismissed" hidden></div>
      </div>
    </div>

    <!-- Chips alone are wider than a phone screen has room to also fit the
         open pull request and signout beside, so both need the line to
         themselves. flex-basis:100% forces that break, but only on this
         empty, zero-height item - putting it on head-open instead would
         claim the whole new line for itself and bump signout to a third
         line rather than sharing this one. -->
    <span class="row-break"></span>

    <span class="head-open">
      <span class="title" id="head-title"></span>
      <span class="mono head-stats" id="head-stats"></span>
    </span>

    <span class="spacer"></span>
    <button id="signout" title="Forget this destination's token and sign in again" hidden>Sign out</button>
  </header>

  <main>
    <section class="pane">
      <div class="pane-head" id="blurb-head" hidden><span>summary</span></div>
      <div id="blurb"></div>
      <div class="pane-head"><span>agent verdict</span><span class="spacer"></span><button class="flag-toggle" id="files-flagged" hidden title="Hide lenses and files with no drafted comments"><span class="box"></span>flagged only</button></div>
      <div id="analysis"></div>
      <div class="pane-head" id="kinds-head" hidden><span>themes</span></div>
      <div id="kinds" style="display: grid; gap: 2px; padding: 8px 0 10px"></div>
      <div class="pane-head" id="files-head" hidden><span>files</span><span id="file-count" style="color: var(--dim2)"></span></div>
      <div id="files"></div>
    </section>

    <section id="comment">
      <div id="tab-summary">
        <div class="prose" id="comment-notes"></div>
        <div class="prose" id="comment-body"></div>
        <textarea id="editor" hidden spellcheck="false"></textarea>
        <div class="prose" id="comment-cards"></div>
        <div class="prose" id="comment-extra"></div>
      </div>

      <div id="tab-diff" hidden>
        <div id="diff"></div>
      </div>

      <div id="tab-qa" hidden>
        <div id="qa"></div>
      </div>
    </section>
  </main>

  <footer>
    <div class="payload mono">
      <span id="staged"></span>
      <span id="counts"></span>
    </div>
    <!-- The one report a screen reader is told about. The copies inside the
         overlays carry the same words for the eye and are hidden from it, so
         a failure is announced once wherever it was raised. -->
    <span id="status" role="status" aria-live="polite"></span>
    <span class="fdivider"></span>
    <div class="verdicts" id="verdicts">
      <button data-event="APPROVE" aria-pressed="false"><span class="dot"></span>Approve</button>
      <button data-event="COMMENT" aria-pressed="false"><span class="dot"></span>Comment</button>
      <button data-event="REQUEST_CHANGES" aria-pressed="false"><span class="dot"></span>Request changes</button>
      <button data-event="DISMISS" aria-pressed="false" hidden><span class="dot"></span>Dismiss</button>
    </div>
    <span class="consequence" id="consequence"></span>
    <span class="spacer"></span>
    <button id="post" disabled>Post review</button>
  </footer>
</div>

<div id="celebrate" class="scrim" hidden>
  <canvas id="confetti"></canvas>
  <div class="cheer">
    <div class="cheer-mark" id="cheer-mark">&#127881;</div>
    <div class="cheer-title" id="cheer-title">Review posted</div>
    <div class="cheer-done mono" id="cheer-slug"></div>
    <div id="cheer-pr"></div>
    <div class="cheer-note" id="cheer-note" hidden></div>
    <a class="mono cheer-link" id="cheer-link" target="_blank" rel="noreferrer">read it on GitHub</a>
    <!-- Leaves the demo frame rather than loading the page inside it. -->
    <a class="cheer-cta" id="cheer-cta" target="_top" hidden></a>
    <div class="cheer-actions">
      <button id="cheer-close">Back to the queue</button>
      <button id="cheer-next" hidden>Next ready review &#8594;</button>
    </div>
    <div id="celebrate-say" aria-hidden="true"></div>
  </div>
</div>

<!-- The settings panel: every source and destination on the left, one of them
     opened on the right. At body level rather than in the header, because it is
     a centred modal over the whole app, not a popover under a chip. -->
<div class="settings-scrim" id="setup-backdrop" hidden></div>
<div class="settings" id="setup-popover" hidden>
  <div class="settings-nav">
    <div class="settings-group mono"><span>draft sources</span><span class="spacer"></span><span id="source-attention"></span></div>
    <div id="source-list"></div>
    <div class="settings-group mono"><span>destinations</span><span class="spacer"></span><span id="destination-attention"></span></div>
    <div id="destination-list"></div>
    <div class="spacer"></div>
    <button class="settings-add" id="settings-add" type="button">+ Add</button>
  </div>
  <div class="settings-detail">
    <div class="settings-teach" id="settings-teach" hidden></div>
    <div class="settings-blank mono" id="settings-blank" hidden>Pick a source or a destination on the left, or add one.</div>
    <form class="settings-form" id="source-form" hidden></form>
    <form class="settings-form" id="destination-form" hidden></form>
  </div>
  <div id="setup-say" aria-hidden="true"></div>
</div>

<div id="confirm" hidden>
  <div class="sheet">
    <div class="sheet-head">
      <div class="sheet-title">
        <span class="h">Post this review?</span>
        <span class="verdict-badge mono" id="confirm-verdict"></span>
        <span class="spacer"></span>
        <span class="mono" id="confirm-target"></span>
      </div>
      <div class="mono sheet-count" id="confirm-count"></div>
    </div>

    <div class="sheet-body">
      <div class="prose" id="confirm-preview"></div>
    </div>

    <div id="confirm-say" aria-hidden="true"></div>

    <div class="sheet-foot">
      <span class="mono" id="confirm-note">nothing has been sent yet</span>
      <span class="spacer"></span>
      <button id="confirm-cancel">Keep editing</button>
      <button id="confirm-post">Post to GitHub</button>
    </div>
  </div>
</div>

<script type="module" src="./src/app/view.js"></script>
<!-- Last, and on its own: the shell that lets the interface start without a
     network is not something the interface waits for, and a browser without
     workers must lose nothing by ignoring it. -->
<script type="module" src="./src/app/offline.js"></script>
</body>
</html>
