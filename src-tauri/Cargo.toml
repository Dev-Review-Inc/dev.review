[package]
name = "reviewer"
version = "0.9.0"
description = "Desktop shell for the reviewer app"
edition = "2021"
license = "Apache-2.0"
authors = ["Dev Review Inc."]
repository = "https://github.com/Dev-Review-Inc/dev.review"
# Tauri itself asks for 1.77.2, but its current dependency tree does not
# resolve below this.
rust-version = "1.88"

[lib]
# Tauri v2 builds mobile targets from the library, so the binary is a shim.
name = "reviewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset lets a video play from the chosen folder without its bytes
# crossing the IPC boundary.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
strip = true

# The sandboxed macOS bundle - see tauri.conf.appstore.json and
# reviewer_macOS.entitlements. App Sandbox forbids spawning a subprocess, so
# git.rs (see the comment at its top) is compiled out under this feature the
# same way it already is for iOS; bookmark.rs, which App Sandbox needs
# instead, is compiled in. Off by default: a plain `cargo build` or the
# Developer ID `.dmg` target never sees either.
[features]
appstore = []

# NSURL's security-scoped bookmark methods are what bookmark.rs is built on,
# and NSWorkspace is how links.rs opens a link in the system browser. wry
# already links both crates into every macOS build; these lines only let
# this crate call them.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSURL", "NSString", "NSData", "NSError", "NSArray", "std"] }

# Gating the Keychain's actual Face ID prompt is only meaningful where a
# Keychain exists to gate - iOS. Desktop keeps using the same IndexedDB
# secret storage it always has; nothing here is a security regression for
# it, since it never carried a keychain integration in the first place.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSFileManager", "NSURL", "NSString", "NSUserDefaults", "std"] }
security-framework = "3.7.0"
tauri-plugin-biometric = "2.3.2"
