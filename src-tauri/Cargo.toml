[package]
name = "reviewer"
version = "0.5.1"
description = "Desktop shell for the reviewer app"
edition = "2021"
# Tauri itself asks for 1.77.2, but its current dependency tree does not
# resolve below this.
rust-version = "1.88"

[lib]
# Tauri v2 builds mobile targets from the library, so the binary is a shim.
name = "reviewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset lets a video play from the chosen folder without its bytes
# crossing the IPC boundary.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
strip = true
