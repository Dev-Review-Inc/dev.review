[package]
name = "reviewer"
version = "0.7.2"
description = "Desktop shell for the reviewer app"
edition = "2021"
license = "Apache-2.0"
authors = ["Dev Review Inc."]
repository = "https://github.com/Dev-Review-Inc/dev.review"
# Tauri itself asks for 1.77.2, but its current dependency tree does not
# resolve below this.
rust-version = "1.88"

[lib]
# Tauri v2 builds mobile targets from the library, so the binary is a shim.
name = "reviewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset lets a video play from the chosen folder without its bytes
# crossing the IPC boundary.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
strip = true

# Gating the Keychain's actual Face ID prompt is only meaningful where a
# Keychain exists to gate - iOS. Desktop keeps using the same IndexedDB
# secret storage it always has; nothing here is a security regression for
# it, since it never carried a keychain integration in the first place.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSFileManager", "NSURL", "NSString", "NSUserDefaults", "std"] }
security-framework = "3.7.0"
tauri-plugin-biometric = "2.3.2"
