<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="reviewer">
  <!-- The iOS cut of app-icon.svg. iOS applies its own corner mask, and the
       App Store refuses an icon with transparency. So the panel fills the
       canvas with square corners. The macOS panel spans 100..924; scaling it
       about the centre by 1024/824 turns its artwork scale of 824/512 into 2.
       Regenerate the opaque PNG in ios/ with:
       rsvg-convert -w 1024 -h 1024 -b '#0e0f12' app-icon-ios.svg | magick - -alpha off -strip PNG24:ios/AppIcon.appiconset/AppIcon-1024.png -->
  <rect width="1024" height="1024" fill="#0e0f12"/>
  <g transform="scale(2)"
     stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M136 176h110M136 240h74" stroke="#3b4252" stroke-width="26"/>
    <path d="M136 336h60" stroke="#3b4252" stroke-width="26"/>
    <path d="M232 322l54 54 110-148" stroke="#6ea8fe" stroke-width="42"/>
  </g>
</svg>
