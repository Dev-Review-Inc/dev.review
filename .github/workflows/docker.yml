name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Outside contributions arrive as pull requests from forks, and a pull request
  # nobody has verified is a pull request the maintainer has to verify by hand.
  # This is also what branch protection requires: a rule can only require a
  # check that actually runs on the pull request.
  pull_request:
    branches: [main]

# Read-only by default. The one job that needs to write does so by asking for it
# itself, so nothing else in this file can be given a token that pushes.
permissions:
  contents: read

jobs:
  # The suite itself is in test.yml so release.yml can wait on it too. It is
  # called rather than duplicated: two copies of a suite drift, and the copy
  # that drifts is the one nobody is watching.
  #
  # The check name changed with this. A called workflow reports its jobs as
  # "<calling job> / <called job>", so what used to appear as `test` now
  # appears as `test / test`. GitHub offers no way to flatten it.
  #
  # Nothing requires either name today: branch protection and rulesets both
  # need Pro or a public repository, and this one is private on neither. The
  # name is written down here because the moment protection is switched on,
  # `test / test` is the string it has to ask for, and a rule that names a
  # check nobody reports blocks every pull request while looking correct.
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    # Only what has landed gets published. A fork's pull request is given a
    # read-only token and no secrets, by design, so an ungated build job would
    # fail at the registry login on every outside contribution and read as the
    # contributor's fault. Nothing from a fork is ever built into an image
    # anyone can pull.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # An image path must be lowercase, and the owner is Dev-Review-Inc. Taking
      # github.repository_owner verbatim produces a reference the registry
      # refuses, so it is folded here rather than hardcoded, which would go
      # stale the next time the account moves.
      - id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # dev-review, not dev.review: a dot is legal in an image path but it
          # reads as a registry hostname to enough tools to be a bad bet.
          images: ghcr.io/${{ steps.owner.outputs.name }}/dev-review
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            # The full sha, so an install can be pinned to an exact commit and
            # a rollback has a name to go back to. `latest` is what ONCE
            # installs by default.
            type=sha,prefix=,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v5
        with:
          # The context is the repository root and the Dockerfile is not in it.
          # serve/ is its own Go module and go:embed cannot reach outside a
          # module, so the build copies the repository's web/ in. Drop the file:
          # key and there is no Dockerfile at the root to find; move the context
          # into serve/ and the build embeds the placeholder interface.
          context: .
          file: serve/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The marketing site assembles its image out of this one, so a publish
      # here is what makes that one stale. Telling it directly beats a schedule
      # that rebuilds a site nothing has changed about.
      #
      # GITHUB_TOKEN cannot trigger a workflow in another repository, so this
      # needs a token with access to both. Absent, the step is skipped and the
      # site rebuilds on its own next push instead: a stale demo, not a failure.
      - name: Ask the site to rebuild
        if: github.ref == 'refs/heads/main' && env.TOKEN != ''
        env:
          TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository_owner }}/www.dev.review/dispatches" \
            -d '{"event_type":"app-published"}'
