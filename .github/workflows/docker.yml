name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Outside contributions arrive as pull requests from forks, and a pull request
  # nobody has verified is a pull request the maintainer has to verify by hand.
  # This is also what branch protection requires: a rule can only require a
  # check that actually runs on the pull request.
  pull_request:
    branches: [main]

# Read-only by default. The one job that needs to write does so by asking for it
# itself, so nothing else in this file can be given a token that pushes.
permissions:
  contents: read

jobs:
  # The name matters: branch protection requires this check by it.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: serve/go.mod
          # serve/ has no dependencies and therefore no go.sum, so there is
          # nothing for the module cache to key on. Asking for it would only
          # produce a warning about a file that will never exist.
          cache: false

      - run: go vet ./...
        working-directory: serve

      - run: go test ./...
        working-directory: serve

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The end to end suite drives real headless Chrome over the DevTools
      # protocol, taking whatever the machine already has: e2e/support/browser.js
      # honours CHROME_PATH and otherwise searches known paths, /usr/bin/google-chrome
      # among them. The ubuntu-latest image ships Chrome today, so nothing is
      # installed here, but "ships it today" is exactly the assumption worth
      # asserting: name the binary out loud so a runner-image change that
      # dropped it fails on this line, with that as the message, rather than
      # somewhere inside a browser test.
      - run: google-chrome --version

      # No install step: package.json has no dependencies. `npm test` runs the
      # unit suite and then the end to end one, which boots serve/ with `go run`
      # on a free port, so the Go toolchain set up above is needed here too.
      - run: npm test

  build:
    needs: test
    # Only what has landed gets published. A fork's pull request is given a
    # read-only token and no secrets, by design, so an ungated build job would
    # fail at the registry login on every outside contribution and read as the
    # contributor's fault. Nothing from a fork is ever built into an image
    # anyone can pull.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # dev-review, not dev.review: a dot is legal in an image path but it
          # reads as a registry hostname to enough tools to be a bad bet.
          images: ghcr.io/${{ github.repository_owner }}/dev-review
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            # The full sha, so an install can be pinned to an exact commit and
            # a rollback has a name to go back to. `latest` is what ONCE
            # installs by default.
            type=sha,prefix=,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v5
        with:
          # The context is the repository root and the Dockerfile is not in it.
          # serve/ is its own Go module and go:embed cannot reach outside a
          # module, so the build copies the repository's web/ in. Drop the file:
          # key and there is no Dockerfile at the root to find; move the context
          # into serve/ and the build embeds the placeholder interface.
          context: .
          file: serve/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
