name: Release

# Tags only. A release is a deliberate act, and the macOS runner costs ten times
# a Linux one per minute, so nothing here runs on a branch push or a pull request.
#
# The build, signing, notarisation, checks and upload live in the workflow
# Follow Along and 66 Scripts share, so a fix to the release lands in all three.
# It builds for Apple Silicon only and publishes Reviewer_<version>_aarch64.dmg.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The gate. docker.yml also runs the suite on a tag, but two workflows fired by
  # the same push cannot wait on each other: v0.5.0 and v0.5.1 shipped off a red
  # suite that way. Here the cheap runner decides whether the expensive one starts.
  test:
    uses: ./.github/workflows/test.yml

  # The shared workflow checks the tag against tauri.conf.json only. This also
  # checks Cargo.toml and both versions in ios-project.yml.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node .github/version.mjs "$GITHUB_REF_NAME"

  macos:
    needs: [test, version]
    uses: dallasread/releases/.github/workflows/macos-release.yml@main
    with:
      project: "."
    permissions:
      contents: write
    # Another owner's workflow cannot inherit secrets, so each is passed by name.
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
